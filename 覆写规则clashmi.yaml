# 1. 使用内联 provider 独立注入你的家里节点，绝对不干扰原有订阅节点
proxy-providers:
  home_provider:
    type: inline
    payload:
      - name: home
        server: riminsyo.top
        port: 1103
        type: ss
        password: "899022"
        cipher: aes-128-gcm
        skip-cert-verify: false
        udp: true

# 2. 保留你的所有策略组，并新增一个读取 home_provider 的策略组
proxy-groups:
  - name: 🚀 手动切换
    include-all: true
    type: select
  - name: 🌍 国外
    type: select
    proxies:
      - 🇨🇳 台湾节点
      - 🇭🇰 香港节点
      - 🇯🇵 日本节点
      - 🇸🇬 新加坡节点
      - 🇰🇷 韩国节点
      - 🇺🇲 美国节点
      - 🚀 手动切换
      - DIRECT
  - name: Ⓜ️ Microsoft
    type: select
    proxies:
      - DIRECT
      - 🚀 手动切换
  - name: 🍎 Apple
    type: select
    proxies:
      - DIRECT
      - 🚀 手动切换
  - name: 🌏 国内
    type: select
    proxies:
      - DIRECT
      - 🚀 手动切换
  - name: 🏠 家里访问
    type: select
    use:
      - home_provider
  - name: 🇭🇰 香港节点
    include-all: true
    filter: (?i)港|HK|hk|Hong Kong|HongKong|hongkong
    type: select
  - name: 🇯🇵 日本节点
    include-all: true
    filter: (?i)日本|川日|东京|大阪|泉日|埼玉|沪日|深日|JP|Japan
    type: select
  - name: 🇺🇲 美国节点
    include-all: true
    filter: (?i)美|波特兰|达拉斯|俄勒冈|凤凰城|费利蒙|硅谷|拉斯维加斯|洛杉矶|圣何塞|圣克拉拉|西雅图|芝加哥|US|United States
    type: select
  - name: 🇨🇳 台湾节点
    include-all: true
    filter: (?i)台|新北|彰化|TW|Taiwan
    type: select
  - name: 🇸🇬 新加坡节点
    include-all: true
    filter: (?i)新加坡|坡|新加坡|SG|Singapore
    type: select
  - name: 🇰🇷 韩国节点
    include-all: true
    filter: (?i)KR|Korea|KOR|首尔|韩|韓
    type: select

# 3. 原封不动保留你的分流规则集
rule-providers:
  Microsoft:
    url: https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/Microsoft/Microsoft.list
    path: ./Microsoft/Microsoft.list
    behavior: classical
    interval: 86400
    format: text
    type: http
  Apple:
    url: https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/Apple/Apple.list
    path: ./Apple/Apple.list
    behavior: classical
    interval: 86400
    format: text
    type: http
  Proxy:
    url: https://raw.githubusercontent.com/minsyo/clash/refs/heads/main/Proxy.list
    path: ./main/Proxy.list
    behavior: classical
    interval: 86400
    format: text
    type: http
  ProxyGuaranteed:
    url: https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/refs/heads/master/rule/Clash/Global/Global.list
    path: ./ruleset/ChinaDomain.list
    behavior: classical
    interval: 86400
    format: text
    type: http

# 4. 把 10.x 网段指向新建的策略组
rules:
  - IP-CIDR,10.0.0.0/8,🏠 家里访问,no-resolve
  - "RULE-SET,Microsoft,Ⓜ️ Microsoft"
  - "RULE-SET,Apple,🍎 Apple"
  - "RULE-SET,Proxy,🌍 国外"
  - "RULE-SET,ProxyGuaranteed,🌍 国外"
  - "MATCH,🌏 国内"